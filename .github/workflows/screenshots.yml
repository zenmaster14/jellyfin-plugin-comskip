# Starts a throwaway Jellyfin 12 server with the plugin and photographs its settings page for the README.
name: Screenshots

on:
  push:
    branches: [main]
    paths: ['Jellyfin.Plugin.Comskip/Configuration/configPage.html', 'tools/screenshots/**', '.github/workflows/screenshots.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build plugin
        run: dotnet publish Jellyfin.Plugin.Comskip/Jellyfin.Plugin.Comskip.csproj -c Release -o out

      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start demo Jellyfin server
        run: bash tools/screenshots/setup-demo-server.sh "$PWD/out/Jellyfin.Plugin.Comskip.dll" "$RUNNER_TEMP/demo"

      - name: Take screenshots
        run: python tools/screenshots/take_screenshots.py docs/images

      - name: Debug on failure
        if: failure()
        run: |
          docker logs jellyfin 2>&1 | tail -80 || true
          python - <<'PY' || true
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(); pg = b.new_page(viewport={"width":1280,"height":900})
              pg.goto("http://localhost:8096/web/"); pg.wait_for_timeout(5000); pg.screenshot(path="debug.png"); b.close()
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            docs/images/*.png
            debug.png
          if-no-files-found: ignore

      - name: Commit screenshots
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/images/*.png
          git diff --cached --quiet && exit 0
          git commit -m "Update README screenshots"
          git pull --rebase origin main
          git push origin main
