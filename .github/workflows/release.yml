# Bump `version:` in build.yaml and push to main (or run this workflow by hand) to build the
# plugin, publish a GitHub release with the zip and add the version to manifest.json.
# Users install from:
#   https://raw.githubusercontent.com/<owner>/<repo>/main/manifest.json
name: Release

on:
  push:
    branches: [main]
    paths: ['build.yaml', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Work out version
        id: v
        run: |
          VERSION="$(grep -E '^version:' build.yaml | sed -E 's/^version:[[:space:]]*"?([^"]+)"?.*/\1/')"
          # Jellyfin wants four-part versions.
          while [ "$(echo "$VERSION" | tr -cd '.' | wc -c)" -lt 3 ]; do VERSION="$VERSION.0"; done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          dotnet publish Jellyfin.Plugin.Comskip/Jellyfin.Plugin.Comskip.csproj -c Release -o out \
            -p:Version=${{ steps.v.outputs.version }} \
            -p:AssemblyVersion=${{ steps.v.outputs.version }} \
            -p:FileVersion=${{ steps.v.outputs.version }}

      - name: Package
        id: pkg
        run: |
          ZIP="comskip_${{ steps.v.outputs.version }}.zip"
          (cd out && zip -j "../$ZIP" Jellyfin.Plugin.Comskip.dll)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "md5=$(md5sum "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" --target "$GITHUB_SHA" "${{ steps.pkg.outputs.zip }}" \
            --title "${{ steps.v.outputs.tag }}" --notes "Comskip plugin ${{ steps.v.outputs.version }} for Jellyfin 12.x" \
            || gh release upload "${{ steps.v.outputs.tag }}" "${{ steps.pkg.outputs.zip }}" --clobber

      - name: Update manifest.json
        run: |
          python3 - <<'EOF'
          import json, datetime, os
          version = "${{ steps.v.outputs.version }}"
          url = f"https://github.com/${{ github.repository }}/releases/download/${{ steps.v.outputs.tag }}/${{ steps.pkg.outputs.zip }}"
          with open("manifest.json") as f:
              manifest = json.load(f)
          plugin = manifest[0]
          plugin["versions"] = [v for v in plugin["versions"] if v["version"] != version]
          plugin["versions"].insert(0, {
              "version": version,
              "changelog": "See GitHub release ${{ steps.v.outputs.tag }}",
              "targetAbi": "12.0.0.0",
              "sourceUrl": url,
              "checksum": "${{ steps.pkg.outputs.md5 }}",
              "timestamp": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          })
          with open("manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          EOF
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet || git commit -m "manifest: add ${{ steps.v.outputs.version }}"
          git pull --rebase origin main
          git push origin main
